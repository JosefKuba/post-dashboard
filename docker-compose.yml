services:
  npm-db:
    image: jc21/mariadb-aria:latest
    container_name: npm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: npm_root_password
      MYSQL_DATABASE: npm
      MYSQL_USER: npm
      MYSQL_PASSWORD: npm_password
    volumes:
      - npm_db_data:/var/lib/mysql
    networks:
      - proxy

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      DB_MYSQL_HOST: npm-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: npm_password
      DB_MYSQL_NAME: npm
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - npm-db
    networks:
      - proxy

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - proxy

  db:
    image: postgres:16
    container_name: post_dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - post_dashboard_pgdata_v6:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  api:
    build: ./backend
    container_name: post_dashboard_api
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - proxy

  worker:
    build: ./backend
    container_name: post_dashboard_worker
    restart: unless-stopped
    command: ["python", "-u", "worker.py"]
    env_file:
      - ./.env
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

  web:
    build: ./frontend
    container_name: post_dashboard_web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - app
      - proxy

networks:
  proxy:
    name: post_dashboard_proxy
  app:
    name: post_dashboard_app

volumes:
  npm_db_data:
  npm_data:
  npm_letsencrypt:
  portainer_data:
  post_dashboard_pgdata_v6:
    name: post_dashboard_pgdata_v6
