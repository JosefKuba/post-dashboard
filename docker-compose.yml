services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  db:
    image: postgres:16
    container_name: post_dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - post_dashboard_pgdata_v6:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  api:
    build: ./backend
    container_name: post_dashboard_api
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

  worker:
    build: ./backend
    container_name: post_dashboard_worker
    restart: unless-stopped
    command: ["python", "-u", "worker.py"]
    env_file:
      - ./.env
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

  web:
    build: ./frontend
    container_name: post_dashboard_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    networks:
      - app

networks:
  app:
    name: post_dashboard_app

volumes:
  portainer_data:
  post_dashboard_pgdata_v6:
    name: post_dashboard_pgdata_v6
